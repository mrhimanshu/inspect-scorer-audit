name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to re-check against the latest Inspect AI release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: inspect-scorer-audit --out results
      - uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: results/

  lmeval:
    # lm-eval pins a different antlr4 runtime from Inspect AI, so it gets its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lmeval.txt
      - run: pytest -q tests/test_lmeval.py
      - run: python -m scorer_audit.lmeval --out results/lmeval
      - uses: actions/upload-artifact@v4
        with:
          name: lmeval-audit-results
          path: results/lmeval/
